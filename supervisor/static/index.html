<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RealJaen Supervisor</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="supervisor-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>REALJAEN SUPERVISOR</span>
        </div>

        <label class="video-selector" for="video-select">
          <span>VIDEO</span>
          <select id="video-select" disabled>
            <option>Loading videos…</option>
          </select>
        </label>

        <nav class="mode-tabs" aria-label="Workspace mode">
          <button class="mode-tab is-active" type="button" data-mode="field">FIELD</button>
          <button class="mode-tab" type="button" data-mode="people">PEOPLE</button>
        </nav>

        <div class="actions">
          <button class="button button-secondary debug-toggle" id="debug-toggle" type="button" aria-pressed="false">Debug overlay</button>
          <span class="save-status" id="save-status" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="save-status-label">UNSAVED</span>
          </span>
          <button class="button button-secondary" type="button">Undo</button>
          <button class="button button-primary" type="button" id="save-button">Save</button>
        </div>
      </header>

      <section class="workspace" aria-label="Video workspace">
        <div class="work-area">
          <video id="video" class="video" playsinline preload="metadata"></video>
          <canvas id="video-overlay" class="video-overlay" aria-hidden="true"></canvas>
          <div class="work-area-message" id="workspace-message">
            <span class="work-area-kicker" id="mode-label">FIELD MODE</span>
            <h1 id="workspace-title">Video workspace</h1>
            <p id="workspace-description">Choose a video to begin.</p>
          </div>
        </div>
      </section>

      <footer class="controls" aria-label="Video controls">
        <div class="transport-controls">
          <button class="icon-button" id="previous-frame" type="button" aria-label="Previous frame" disabled>|&lt;</button>
          <button class="play-button" id="play-pause" type="button" aria-label="Play" disabled>▶</button>
          <button class="icon-button" id="next-frame" type="button" aria-label="Next frame" disabled>&gt;|</button>
        </div>
        <input class="timeline" id="timeline" type="range" min="0" max="0" value="0" step="0.001" aria-label="Timeline" disabled />
        <div class="time-readout"><span id="current-time">00:00:00</span> <span>/</span> <span id="total-time">00:00:00</span></div>
        <div class="frame-controls">
          <button class="frame-button" id="previous-frame-label" type="button" disabled>− Frame</button>
          <span class="frame-readout" id="frame-readout">Frame —</span>
          <button class="frame-button" id="next-frame-label" type="button" disabled>+ Frame</button>
        </div>
      </footer>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
