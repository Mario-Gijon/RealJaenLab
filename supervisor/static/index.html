<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RealJaen Supervisor</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="is-library">
    <section class="library-screen" id="library-screen" aria-label="Biblioteca de vídeos"></section>
    <main class="supervisor-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>REALJAÉN SUPERVISOR</span></div>
        <div class="workspace-title"><span>VIDEO FOUNDATION</span><strong id="video-name">Sin vídeo seleccionado</strong></div>
        <button class="button button-secondary" id="back-to-library" type="button">← Biblioteca</button>
      </header>
      <section class="workspace" aria-label="Reproductor de vídeo">
        <div class="video-stage" id="video-stage">
          <video id="video" class="video" playsinline preload="metadata"></video>
          <div class="video-empty" id="video-empty"><span>VIDEO FOUNDATION</span><strong id="workspace-title">Selecciona un vídeo</strong><p id="workspace-description">Abre un partido desde la biblioteca para reproducirlo y navegar por fotogramas.</p></div>
        </div>
        <aside class="video-info" id="video-info" hidden>
          <span>VÍDEO ACTIVO</span>
          <strong id="video-info-name"></strong>
          <small id="video-info-meta"></small>
        </aside>
      </section>
      <footer class="controls" aria-label="Controles de vídeo">
        <div class="transport-controls">
          <button class="icon-button" id="previous-frame" type="button" aria-label="Fotograma anterior" disabled>|&lt;</button>
          <button class="play-button" id="play-pause" type="button" aria-label="Reproducir" disabled>▶</button>
          <button class="icon-button" id="next-frame" type="button" aria-label="Fotograma siguiente" disabled>&gt;|</button>
          <button class="icon-button" id="mute-toggle" type="button" aria-label="Activar sonido" aria-pressed="true" disabled>🔇</button>
        </div>
        <input class="timeline" id="timeline" type="range" min="0" max="0" value="0" step="0.001" aria-label="Línea de tiempo" disabled />
        <div class="time-readout"><span id="current-time">00:00:00</span> <span>/</span> <span id="total-time">00:00:00</span></div>
        <div class="frame-controls">
          <button class="frame-button" id="previous-frame-label" type="button" disabled>− Fotograma</button>
          <span class="frame-readout" id="frame-readout">Fotograma —</span>
          <button class="frame-button" id="next-frame-label" type="button" disabled>+ Fotograma</button>
        </div>
      </footer>
    </main>
    <script src="/static/app.js"></script>
    <script src="/static/library.js"></script>
  </body>
</html>
