<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RealJaen Supervisor</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="supervisor-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>REALJAEN SUPERVISOR</span>
        </div>

        <nav class="mode-tabs" aria-label="Workspace mode">
          <button class="mode-tab is-active" type="button" data-mode="field">FIELD</button>
          <button class="mode-tab" type="button" data-mode="people">PEOPLE</button>
        </nav>

        <div class="actions">
          <span class="save-status" id="save-status" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="save-status-label">UNSAVED</span>
          </span>
          <button class="button button-secondary" type="button">Undo</button>
          <button class="button button-primary" type="button" id="save-button">Save</button>
        </div>
      </header>

      <section class="workspace" aria-label="Video workspace">
        <div class="work-area">
          <div class="work-area-message">
            <span class="work-area-kicker" id="mode-label">FIELD MODE</span>
            <h1>Video workspace</h1>
            <p>Video support will be added in the next step.</p>
          </div>
        </div>
      </section>

      <footer class="controls" aria-label="Video controls">
        <div class="transport-controls">
          <button class="icon-button" type="button" aria-label="Previous frame">|&lt;</button>
          <button class="play-button" type="button" aria-label="Play">▶</button>
          <button class="icon-button" type="button" aria-label="Next frame">&gt;|</button>
        </div>
        <div class="timeline" aria-label="Timeline placeholder">
          <span class="timeline-progress"></span>
          <span class="timeline-handle"></span>
        </div>
        <div class="time-readout">00:00:00 <span>/</span> 00:00:00</div>
        <div class="frame-controls">
          <button class="frame-button" type="button">− Frame</button>
          <span class="frame-readout">Frame —</span>
          <button class="frame-button" type="button">+ Frame</button>
        </div>
      </footer>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
